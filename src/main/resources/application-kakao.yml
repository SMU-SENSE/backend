# Activate Kakao without changing the existing Google-only deployment:
# SPRING_PROFILES_ACTIVE=postgres,kakao (or kakao for local H2 development).
spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - openid
              - account_email
              - profile_nickname
            provider: kakao
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
