server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: malmoa-backend
  datasource:
    url: jdbc:h2:mem:malmoa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - profile
              - email

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
