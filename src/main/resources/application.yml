server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: malmoa-backend
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:malmoa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  http:
    client:
      # 현재 RestClient 사용처는 OpenAI 문장 생성뿐. 초과하면 앱에 카드 라벨 이어붙이기로 대체 응답.
      connect-timeout: 3s
      read-timeout: ${OPENAI_TIMEOUT:5s}
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  pairing:
    qr-prefix: ${PAIRING_QR_PREFIX:malmoa://pair?token=}
  fcm:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  recommend:
    model-location: ${RECOMMEND_MODEL_LOCATION:classpath:models/ngram/model.json}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
