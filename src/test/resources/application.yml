spring:
  datasource:
    url: jdbc:h2:mem:malmoa-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
  jpa:
    open-in-view: false
    show-sql: false

logging:
  level:
    org.hibernate.orm.jdbc.bind: off
